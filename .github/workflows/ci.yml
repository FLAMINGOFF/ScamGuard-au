name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content integrity tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and axe accessibility tests
        run: npx playwright test --trace off
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phones ship CJK fonts (PingFang, Noto Sans CJK); the runner does not. Without one, Chrome
      # spends seconds on font fallback for the Chinese pages and Lighthouse misreports performance.
      - name: Install Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Run Lighthouse CI (fails below the thresholds in lighthouserc.json)
        run: npx lhci autorun
      - name: Build badge data
        if: always()
        run: node scripts/lighthouse-badges.js .lighthouseci badges
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: |
            .lighthouseci/
            badges/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse
          path: lh
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js .nojekyll _site/
          cp -r lh/badges _site/badges
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
